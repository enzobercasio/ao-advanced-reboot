# Job inventory. One host only.
# The playbooks use hosts: all and run_once. Extra hosts in this inventory
# would make the state file land on whichever host Ansible contacts first.
# The tier names live in state/storefront.initial.json. They are not SSH targets.

[all]
state-host ansible_host=REPLACE_WITH_REACHABLE_ADDRESS ansible_user=ec2-user
