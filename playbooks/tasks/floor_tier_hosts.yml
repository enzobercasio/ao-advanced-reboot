---
- name: Hosts in this tier
  ansible.builtin.set_fact:
    tier_hosts: "{{ base.hosts | selectattr('tier', 'equalto', tier_key) | list }}"

- name: Floor for this tier
  ansible.builtin.include_tasks: tasks/tier_floor.yml

- name: Keep the first hosts up to the floor
  ansible.builtin.set_fact:
    keep_names: "{{ (tier_hosts | map(attribute='name') | list | sort)[: (minimum | int)] }}"
    rewritten: []

- name: Mark everyone past the floor unhealthy
  ansible.builtin.set_fact:
    rewritten: "{{ rewritten + [updated] }}"
  loop: "{{ base.hosts }}"
  loop_control:
    loop_var: host
  vars:
    updated: "{{ host | combine({'healthy': host.name in keep_names}) if host.tier == tier_key else host }}"

- name: Save the rewritten host list
  ansible.builtin.set_fact:
    base: "{{ base | combine({'hosts': rewritten}) }}"
