---
- name: Shut down one tier of this round
  hosts: all
  gather_facts: false
  run_once: true
  vars_files:
    - paths.yml
  tasks:
    - name: Require a tier name
      ansible.builtin.assert:
        that: tier_name in ['web', 'app', 'db']
        fail_msg: "Pass tier_name as web, app, or db."

    - name: Load the service state
      ansible.builtin.include_tasks: tasks/load_state.yml

    - name: Normalise the host list
      ansible.builtin.include_tasks: tasks/normalise_hosts.yml

    - name: Apply a simulated shutdown fault
      when:
        - svc.fault.host | length > 0
        - svc.fault.host in hosts_now
        - svc.fault.step == 'shutdown'
        - svc.fault.tier == tier_name
        - (svc.fault.remaining | int) > 0
      block:
        - name: Decrement the fault counter before failing
          ansible.builtin.copy:
            dest: "{{ state_path }}"
            mode: "0644"
            content: "{{ svc | combine({'fault': svc.fault | combine({'remaining': (svc.fault.remaining | int) - 1})}) | to_nice_json }}\n"

        - name: Fail this shutdown on purpose
          ansible.builtin.fail:
            msg: "SIMULATED FAILURE shutdown {{ svc.fault.host }} tier={{ tier_name }} remaining_after={{ (svc.fault.remaining | int) - 1 }}"

    - name: No hosts in this tier for this round
      ansible.builtin.debug:
        msg: "NOOP shutdown tier={{ tier_name }}"
      when: hosts_now | length == 0

    - name: Shut down each selected host
      ansible.builtin.debug:
        msg: "SHUTDOWN {{ item }} tier={{ tier_name }}"
      loop: "{{ hosts_now }}"
      loop_control:
        label: "{{ item }}"
      when: hosts_now | length > 0
