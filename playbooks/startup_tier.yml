---
- name: Start one tier of this round
  hosts: all
  gather_facts: false
  run_once: true
  vars_files:
    - paths.yml
  tasks:
    - name: Require a tier name
      ansible.builtin.assert:
        that: tier_name in ['web', 'app', 'db']
        fail_msg: "Pass tier_name as web, app, or db."

    - name: Load the service state
      ansible.builtin.include_tasks: tasks/load_state.yml

    - name: Normalise the host list
      ansible.builtin.include_tasks: tasks/normalise_hosts.yml

    - name: Clear needs_reboot for hosts that came back up
      ansible.builtin.set_fact:
        updated_hosts: "{{ updated_hosts | default([]) + [next_host] }}"
      loop: "{{ svc.hosts }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        next_host: "{{ item | combine({'needs_reboot': false}) if item.name in hosts_now else item }}"

    - name: Save the service state
      ansible.builtin.copy:
        dest: "{{ state_path }}"
        mode: "0644"
        content: "{{ svc | combine({'hosts': updated_hosts}) | to_nice_json }}\n"

    - name: Publish the updated state
      ansible.builtin.set_stats:
        per_host: false
        data:
          tier_name: "{{ tier_name }}"
          started: "{{ hosts_now }}"
          needs_reboot: "{{ updated_hosts | selectattr('needs_reboot') | list | length | int }}"

    - name: No hosts in this tier for this round
      ansible.builtin.debug:
        msg: "NOOP startup tier={{ tier_name }}"
      when: hosts_now | length == 0

    - name: Start each selected host
      ansible.builtin.debug:
        msg: "STARTUP {{ item }} tier={{ tier_name }}"
      loop: "{{ hosts_now }}"
      loop_control:
        label: "{{ item }}"
      when: hosts_now | length > 0
