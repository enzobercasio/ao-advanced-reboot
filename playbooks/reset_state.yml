---
# Lab only. Writes a fresh state before a run.
#   fleet:    default (4/4/3), flex (6/3/5) or solo_db (4/4/1)
#   scenario: happy, retry, hard, no_return, blocked
- name: Reset the lab state
  hosts: all
  gather_facts: false
  run_once: true
  vars_files:
    - paths.yml
  vars:
    fleets:
      default: {web: 4, app: 4, db: 3}
      flex: {web: 6, app: 3, db: 5}
      solo_db: {web: 4, app: 4, db: 1}
    scenarios:
      happy: {faults: {}, unhealthy: []}
      # web-02 fails once. The job retry heals it.
      retry:
        faults: {web: {web-02: {remaining: 1, mode: fail}}}
        unhealthy: []
      # db-01 fails twice. The retry also fails, the run stops, Retry run heals it.
      hard:
        faults: {db: {db-01: {remaining: 2, mode: fail}}}
        unhealthy: []
      # app-01 never comes back healthy.
      no_return:
        faults: {app: {app-01: {remaining: 99, mode: no_return}}}
        unhealthy: []
      # Every tier already at its minimum.
      blocked:
        faults: {}
        unhealthy: [web-02, web-03, web-04, app-03, app-04, db-03]
    fleet_now: "{{ fleets[fleet | default('default')] }}"
    scenario_now: "{{ scenarios[scenario | default('happy')] }}"
  tasks:
    - name: Make the state directory
      ansible.builtin.file:
        path: "{{ state_dir }}"
        state: directory
        mode: "0755"

    - name: Write each tier
      ansible.builtin.template:
        src: tier_state.json.j2
        dest: "{{ state_dir }}/{{ tier }}.json"
        mode: "0644"
      vars:
        count: "{{ fleet_now[tier] }}"
        faults: "{{ scenario_now.faults[tier] | default({}) }}"
        unhealthy: "{{ scenario_now.unhealthy }}"
      loop: [web, app, db]
      loop_control:
        loop_var: tier

    - name: Write the round counter
      ansible.builtin.copy:
        dest: "{{ state_dir }}/meta.json"
        mode: "0644"
        content: "{{ {'service': 'storefront', 'rounds_completed': 0} | to_nice_json }}\n"

    - name: Print the reset
      ansible.builtin.debug:
        msg: "RESET fleet={{ fleet | default('default') }} scenario={{ scenario | default('happy') }} web={{ fleet_now.web }} app={{ fleet_now.app }} db={{ fleet_now.db }}"
