---
- name: Stop because no tier has room to reboot
  hosts: all
  gather_facts: false
  run_once: true
  vars_files:
    - paths.yml
  tasks:
    - name: Load the live state
      ansible.builtin.include_tasks: tasks/load_state.yml

    - name: List hosts that still need a reboot
      ansible.builtin.set_fact:
        still_hosts: "{{ still | sort }}"
      vars:
        still: "{{ tiers.values() | map(attribute='hosts') | map('dict2items') | map('selectattr', 'value.needs_reboot') | map('map', attribute='key') | map('list') | flatten }}"

    - name: Fail the run with a clear reason
      ansible.builtin.fail:
        msg: "BLOCKED. These hosts still need a reboot, but every tier is at its minimum or the host is unhealthy: {{ still_hosts | join(',') }}"
